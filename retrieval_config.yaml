# retrieval_config.yaml — 检索参数统一配置（修改后重启程序生效）
# 文件不存在时全部使用代码内默认值，程序可独立运行

vector:
  similarity_top_k: 10          # 向量检索返回片段数（CLI/Web 统一）
  response_mode: tree_summarize  # LLM 回答模式

fulltext:
  top_k: 20                     # 全文搜索返回片段数
  bm25_k1: 1.5                  # BM25 词频饱和参数
  bm25_b: 0.75                  # BM25 文档长度归一化参数

chunk:
  chunk_size: 512               # 文本分块大小
  chunk_overlap: 50             # 分块重叠

highlight:
  top_n: 2                      # 每个片段高亮几句
  threshold: 0.5                # 相似度低于此值的句子不高亮

ingest:
  batch_size: 1000              # 单批 ingest 最大文件数（大库分批处理，避免一次性内存压力）
  auto_continue_timeout: 10     # 每批结束后等待用户确认的秒数，超时自动继续下一批

dedup:
  simhash_enabled: true         # SimHash 近似转载拦截（同一文章被转载/不同文件同内容时跳过）
  simhash_threshold: 3          # 64 位指纹的汉明距离阈值，<= 此值判为同一篇（调大更宽松、误杀增多）
  simhash_min_chars: 8          # 正文归一化后短于此长度的不算 SimHash，只按精确哈希去重
